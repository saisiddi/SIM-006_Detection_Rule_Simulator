services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sim006-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: sim006-streamlit
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: sim006-test
