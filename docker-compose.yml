services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sim006-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: sim006-streamlit
    ports:
      - "8501:8501"
    # Legacy UI: not started by a plain `docker compose up`, so it cannot be opened by mistake.
    profiles: ["legacy-streamlit"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: sim006-test
