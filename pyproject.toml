[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim_006"
version = "0.1.0"
description = "Detection Rule Simulator for the Battery Cybersecurity Platform"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["sim_006"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
